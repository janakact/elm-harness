<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">Elm harness: high-level architecture</title>
<desc id="desc">Elm browser and terminal views connect to one authoritative Elm core. A compiled Elm plugin imports public app types and owns its own state and views. The thin Node host handles storage, model HTTP and read-only external agent processes. Codex and Claude retain their internal loops while Elm owns job state.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#65728a"/></marker>
 <style>text{font-family:Inter,system-ui,sans-serif;fill:#263550;text-anchor:middle}.title{font-size:29px;font-weight:700}.heading{font-size:24px;font-weight:650}.sub{font-size:16px;fill:#637089}.label{font-size:14px;fill:#637089}.box{stroke-width:2;rx:15}.wire{fill:none;stroke:#65728a;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
</defs>
<rect width="1120" height="830" fill="#fbfcff"/>
<text x="560" y="49" class="title">One Elm core. Two views. Pluggable execution.</text>
